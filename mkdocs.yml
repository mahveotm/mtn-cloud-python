site_name: MTN Cloud Python SDK
site_description: Community Python SDK docs for MTN Cloud
repo_url: https://github.com/mahveotm/mtn-cloud-python
repo_name: mahveotm/mtn-cloud-python

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  features:
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Source Sans 3
    code: JetBrains Mono

markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Instances: instances.md
  - Networking: networking.md
  - Storage: storage.md
  - Security Groups: security-groups.md
  - Backups: backups.md
  - Virtual Images: virtual-images.md
  - Advanced Cookbook: advanced-cookbook.md
  - API Overview: api-overview.md
  - API Reference:
      - Overview: api-reference/index.md
      - Client: api-reference/client.md
      - Instances: api-reference/instances.md
      - Instance Types: api-reference/instance-types.md
      - Networks: api-reference/networks.md
      - Clouds: api-reference/clouds.md
      - Groups: api-reference/groups.md
      - Plans: api-reference/plans.md
      - Storage Buckets: api-reference/storage-buckets.md
      - Archive Buckets: api-reference/archive-buckets.md
      - Security Groups: api-reference/security-groups.md
      - Backups: api-reference/backups.md
      - Virtual Images: api-reference/virtual-images.md
