name: Test

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    types:
      - opened
      - synchronize
  schedule:
    # Run every Monday at midnight
    - cron: "0 0 * * 1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pydantic pydantic-settings types-requests

      - name: Ruff check
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format src tests --check

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        exclude:
          # Reduce matrix for faster CI
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Create coverage directory
        run: mkdir -p coverage

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=mtn_cloud --cov-report=xml:coverage/coverage.xml --cov-report=term-missing
        env:
          COVERAGE_FILE: coverage/.coverage.${{ runner.os }}-py${{ matrix.python-version }}

      - name: Build coverage summary
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          coverage_xml = Path("coverage/coverage.xml")
          root = ET.parse(coverage_xml).getroot()

          line_rate = float(root.attrib.get("line-rate", 0.0)) * 100
          branch_rate = float(root.attrib.get("branch-rate", 0.0)) * 100
          lines_covered = int(root.attrib.get("lines-covered", 0))
          lines_valid = int(root.attrib.get("lines-valid", 0))

          summary = (
              "## Pytest Coverage\n\n"
              f"- Line coverage: **{line_rate:.2f}%** ({lines_covered}/{lines_valid})\n"
              f"- Branch coverage: **{branch_rate:.2f}%**\n"
              "- Report file: `coverage/coverage.xml`\n"
          )

          Path("coverage/coverage-summary.md").write_text(summary, encoding="utf-8")
          print(summary)
          PY

      - name: Publish coverage summary
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        shell: bash
        run: cat coverage/coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ runner.os }}-${{ matrix.python-version }}
          path: coverage/
          include-hidden-files: true

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run mypy
        run: mypy src/mtn_cloud

  # Ensure all jobs pass
  check:
    if: always()
    needs:
      - lint
      - test
      - type-check
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: test
